<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A8B"/><stop offset="1" stop-color="#FF5A5F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4B6"/><stop offset="1" stop-color="#4FD8C9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#B8323A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- thẻ chung nhô lên -->
  <rect x="300" y="250" width="400" height="220" rx="40" fill="url(#card)" transform="rotate(-9 500 360)"/>
  <rect x="360" y="230" width="380" height="210" rx="40" fill="#7C5CFF" transform="rotate(7 550 335)" opacity="0.95"/>
  <!-- thân ví -->
  <g filter="url(#sh)">
    <rect x="212" y="350" width="600" height="430" rx="90" fill="#FFFFFF"/>
  </g>
  <!-- nắp khóa -->
  <rect x="560" y="485" width="290" height="160" rx="80" fill="#FFE4E1"/>
  <!-- trái tim -->
  <path transform="translate(680 568) scale(1.25)" fill="#FF5A5F"
        d="M0 34 C-14 22 -44 4 -44 -16 C-44 -32 -32 -42 -19 -42 C-10 -42 -3 -37 0 -30 C3 -37 10 -42 19 -42 C32 -42 44 -32 44 -16 C44 4 14 22 0 34 Z"/>
</svg>
